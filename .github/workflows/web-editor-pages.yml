name: Web Editor — 테스트 후 GitHub Pages 배포

# web-editor/ 만 빌드한다. 기존 앱과 기존 워크플로에는 영향이 없다.
# 순서: 단위 테스트 → 빌드 → Playwright(Google Chrome) → 모두 통과하면 dist/를 gh-pages 브랜치에 올린다.
# gh-pages 브랜치가 Pages 소스이므로 올리면 https://wegyg.github.io/video-ai-studio-up/ 에 반영된다.
on:
  push:
    branches: [feat/web-editor-spec, main]
    paths:
      - "web-editor/**"
      - ".github/workflows/web-editor-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: write # gh-pages 브랜치에 push

concurrency:
  group: web-editor-pages
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-editor
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-editor/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: Google Chrome 확인 (없으면 설치)
        run: google-chrome --version || npx playwright install --with-deps chrome

      - name: 단위 테스트
        run: npm run test:unit

      - name: 빌드 (타입 검사 포함)
        run: npm run build

      # 수용 기준 A1(재생 성능)·A2(내보내기 시간)에 쓰는 1080p 12초 × 5 파일.
      # 60MB라 저장소에 넣지 않고 그때그때 만든다.
      - name: 성능 측정용 큰 파일 준비
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          npm run fixtures:perf

      - name: E2E 테스트 (Playwright, chrome 채널)
        # pipefail: 테스트가 실패하면 tee가 있어도 이 단계가 실패해야 배포가 막힌다
        shell: bash
        run: |
          set -o pipefail
          npx playwright test 2>&1 | tee ../playwright-output.txt

      # A1(재생)·A2(60초 내보내기)는 CPU를 다 쓰므로 다른 테스트와 겹치면 서로의 시간 측정을 망친다 → 따로, 하나씩
      - name: 수용 기준 A1·A2 (단독 실행)
        env:
          PERF_DIR: ${{ github.workspace }}/web-editor/.perf-fixtures
        shell: bash
        run: |
          set -o pipefail
          npx playwright test acceptance -g "A1|A2" --workers=1 2>&1 | tee ../playwright-perf-output.txt

      - name: 성능·내보내기 측정값 요약에 적기
        if: always()
        working-directory: .
        run: |
          {
            echo "### 확인 2 체크리스트 측정값 (러너: 2코어, GPU 없음 — A1·A2는 기록만)"
            echo '```'
            cat playwright-output.txt playwright-perf-output.txt 2>/dev/null | grep -aE "^(A1|A2|PHONE|LATENCY|AUDIBLE) " || echo "측정값 없음"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 테스트 리포트와 샘플 영상 업로드
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web-editor/playwright-report
            web-editor/test-results
          retention-days: 14
          if-no-files-found: ignore

      - name: gh-pages 브랜치 가져오기
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages-branch

      - name: gh-pages 브랜치에 배포
        working-directory: gh-pages-branch
        run: |
          git rm -rq --ignore-unmatch .
          cp -r ../web-editor/dist/. .
          touch .nojekyll
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -qm "deploy: web-editor ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
          git push origin gh-pages
          echo "배포 주소: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_STEP_SUMMARY"
